<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King of Soul</title>

  <!--
    Fontes externas — Cinzel Decorative para o logo do King of Soul.
    Carregadas do Google Fonts. O jogo funciona sem internet usando
    fallback para Georgia/Palatino (mesma serifa forte) definido no JS.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

  <!--
    Fonte WarioWare Inc. — usada nos textos de ação dos QTEs.
    Coloque o arquivo WarioWareInc.ttf em v2_files/fonts/ para ativar.
    Sem o arquivo, o fallback "Arial Black" é usado automaticamente.
    Veja v2_files/fonts/LEIA_AQUI.md para instruções de download.
  -->
  <style>
    @font-face {
      font-family: 'WarioWareInc';
      src: url('./v2_files/fonts/WarioWareInc.ttf')  format('truetype'),
           url('./v2_files/fonts/WarioWareInc.otf')  format('opentype'),
           url('./v2_files/fonts/WarioWareInc.woff2') format('woff2'),
           url('./v2_files/fonts/WarioWareInc.woff')  format('woff');
      font-weight: normal;
      font-style:  normal;
      font-display: swap; /* usa fallback enquanto carrega, troca quando pronta */
    }
  </style>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    /*
     * O wrapper assume o maior retângulo 16:9 que cabe na viewport.
     * O tamanho real é definido pelo script de resize abaixo.
     * transform-origin: top left permite que o scale parta do canto
     * correto quando o wrapper é centralizado via flexbox.
     */
    #game-wrapper {
      position: relative;
      /* tamanho base do canvas interno */
      width: 480px;
      height: 360px;
      transform-origin: center center;
      /* scale inicial definido pelo script; o CSS só garante o ponto de origem */
    }

    /* Canvas interno — mantém resolução original 480×360 */
    #game-canvas {
      display: block;
      width: 480px;
      height: 360px;
      /* Preserva a renderização pixelada ao escalar */
      image-rendering: pixelated;
      image-rendering: crisp-edges; /* Firefox */
    }

    /* Overlay de flash */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.05s;
    }

    /* Camada de UI DOM sobreposta */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      pointer-events: none;
    }

    #ui-overlay.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game-canvas" width="480" height="360"></canvas>
    <div id="flash-overlay"></div>
    <div id="ui-overlay" class="hidden"></div>
  </div>

  <!--
    =====================================================================
    ESCALA RESPONSIVA — mantém canvas 480×360 interno, escala via CSS
    transform para preencher a tela com proporção correta (letterbox).
    =====================================================================
  -->
  <script>
    (function () {
      var CANVAS_W = 480;
      var CANVAS_H = 360;
      var wrapper  = document.getElementById('game-wrapper');

      function resize() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;

        /* Calcula o maior scale que cabe na viewport sem distorcer */
        var scale = Math.min(vw / CANVAS_W, vh / CANVAS_H);

        wrapper.style.transform = 'scale(' + scale + ')';
      }

      window.addEventListener('resize', resize);
      /* Aplica imediatamente quando o DOM estiver pronto */
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', resize);
      } else {
        resize();
      }
    })();
  </script>

  <!--
    =====================================================================
    ORDEM DE CARREGAMENTO — OBRIGATÓRIA
    =====================================================================

    CAMADA 1 — Base do Micro Loop
      Microgame.js deve ser o PRIMEIRO: define a classe base que todos
      os QTEs herdam. Sem ele, as subclasses falham ao carregar.

    CAMADA 2 — QTEs (Micro Loop)
      Cada QTE estende Microgame. Adicione novos QTEs aqui.

    CAMADA 3 — Renderers de HUD
      UIRenderer  → HUD do micro loop (timer barra, vidas QTE)
      BossRenderer → HUD do macro loop (HP boss, progresso round)
      Ambos são injetados nos managers via main.js.

    CAMADA 4 — Managers
      GameManager    → orquestra o micro loop (deve vir após UIRenderer)
      ConflictScene  → classe BASE das cenas de boss (deve vir antes dos
                       managers que a instanciam)
      ConflictManager → orquestra o macro loop (depende de GameManager
                        e ConflictScene já carregados)

    CAMADA 5 — Cenas de Conflito (Boss Fights)
      Cada cena estende ConflictScene. Adicione novas cenas aqui.
      Devem vir APÓS ConflictScene e ANTES de main.js.

    CAMADA 6 — Ponto de Entrada
      main.js é o ÚLTIMO a carregar: instancia tudo e inicia os loops.
    =====================================================================
  -->

  <!-- CAMADA 1: Base do Micro Loop -->
  <script src="./v2_files/Microgame.js"></script>

  <!--
    CAMADA 2: Sistema de registro de QTEs
    QTERegistry deve ser carregado ANTES de qualquer QTE,
    pois cada QTE chama QTERegistry.register() ao ser carregado.
  -->
  <script src="./v2_files/qtes/QTERegistry.js"></script>

  <!--
    CAMADA 2b: QTEs modulares
    =========================================================
    PARA ADICIONAR UM NOVO QTE:
      1. Crie a pasta:  v2_files/qtes/QTE_XX_Nome/
      2. Crie o arquivo: QTE_XX_Nome.js  (estende Microgame)
      3. Adicione UMA linha aqui abaixo (script src)
      4. Certifique-se que o arquivo chama QTERegistry.register() no final
      Pronto! Não precisa editar main.js nem nenhum outro arquivo.
    =========================================================
  -->
  <script src="./v2_files/qtes/QTE_01_Reflexo/QTE_01_Reflexo.js"></script>
  <script src="./v2_files/qtes/QTE_02_Mashing/QTE_02_Mashing.js"></script>
  <script src="./v2_files/qtes/QTE_03_Patas/QTE_03_Patas.js"></script>
  <script src="./v2_files/qtes/QTE_04_PontoCritico/QTE_04_PontoCritico.js"></script>
  <script src="./v2_files/qtes/QTE_05_Sequencia/QTE_05_Sequencia.js"></script>
  <script src="./v2_files/qtes/QTE_06_Contra/QTE_06_Contra.js"></script>
  <!-- Adicione novos QTEs abaixo: -->
  <!-- <script src="./v2_files/qtes/QTE_03_SeuQTE/QTE_03_SeuQTE.js"></script> -->

  <!-- CAMADA 3: Renderers de HUD -->
  <script src="./v2_files/UIRenderer.js"></script>
  <script src="./v2_files/BossRenderer.js"></script>

  <!-- CAMADA 4: Managers -->
  <script src="./v2_files/GameManager.js"></script>
  <script src="./v2_files/ConflictScene.js"></script>
  <script src="./v2_files/ConflictManager.js"></script>

  <!-- CAMADA 5: Cenas de Conflito (Boss Fights) -->
  <!-- KnightSprite deve vir ANTES das cenas que o utilizam -->
  <script src="./v2_files/KnightSprite.js"></script>
  <script src="./v2_files/ExemploConflito.js"></script>
  <!-- Adicione novos bosses aqui, ex: -->
  <!-- <script src="src/conflict/SegundoChefe.js"></script> -->

  <!-- CAMADA 6: Menu Principal (deve vir após todos os managers e cenas) -->
  <script src="./v2_files/MainMenu.js"></script>

  <!-- CAMADA 7: Ponto de entrada (deve ser o último) -->
  <script src="./v2_files/main.js"></script>


</body></html>
